<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0d12;
    --surface: #141821;
    --border: rgba(255,255,255,0.08);
    --text: #e6e9ee;
    --muted: #8b93a1;
    --accent: #5b8cff;
    --danger: #f2555a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  .card h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card p.sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 18px;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    background: rgba(242,85,90,0.12);
    border: 1px solid rgba(242,85,90,0.3);
    color: var(--danger);
    font-size: 13px;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }
</style>
</head>
<body>
  <form class="card" method="POST" action="/admin/login">
    <h1>Admin Console</h1>
    <p class="sub">Sign in to manage bookings, conversations, and settings.</p>
    <div class="error" id="error" hidden>Incorrect password. Try again.</div>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(window.location.search).get("error")) {
      document.getElementById("error").hidden = false;
    }
  </script>
</body>
</html>
